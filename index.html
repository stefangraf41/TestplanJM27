<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jungfrau-Marathon 2027 Trainingsplan</title><style>
body{font-family:Arial,sans-serif;background:#0f1720;color:#e7eef5;margin:0;padding:16px}
h1{font-size:1.3rem;margin:0 0 4px}.sub{color:#93a4b3;font-size:.85rem;margin-bottom:8px}
#status{padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:.9rem;background:#14532d}
#status.bad{background:#7f1d1d}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button,select{background:#1b2733;color:#e7eef5;border:1px solid #2c3a48;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.9rem}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.stat{background:#1b2733;border:1px solid #2c3a48;border-radius:12px;padding:10px 14px;min-width:100px}
.stat b{font-size:1.3rem;display:block}.stat span{color:#93a4b3;font-size:.75rem}
.phase{color:#93a4b3;font-size:.9rem;margin:2px 0 10px}
#chart{background:#1b2733;border:1px solid #2c3a48;border-radius:12px;padding:10px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:#1b2733;border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid #2c3a48;text-align:left;vertical-align:top;font-size:.85rem}
th{background:#17222d;color:#93a4b3}tr.row{cursor:grab}tr.dragover{outline:2px dashed #5b7183}
tr.warn td{background:rgba(239,68,68,.14)}.wd{font-weight:700}.handle{cursor:grab;color:#93a4b3}
textarea{width:100%;min-width:200px;min-height:44px;background:#121c26;color:#e7eef5;border:1px solid #2c3a48;border-radius:6px;padding:5px;font:inherit;font-size:.83rem}
input.km{width:56px;background:#121c26;color:#e7eef5;border:1px solid #2c3a48;border-radius:6px;padding:5px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;color:#0b1116;font-weight:700}
.done td{opacity:.5}.done textarea{text-decoration:line-through}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;font-size:.72rem;color:#93a4b3}
.legend span{display:inline-flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border-radius:3px}
.balance{margin:10px 0;padding:10px 14px;border-radius:10px;font-size:.9rem}
.balance.ok{background:rgba(20,184,166,.14);border:1px solid #14b8a6}
.balance.bad{background:rgba(239,68,68,.14);border:1px solid #ef4444}</style></head><body>
<h1>Jungfrau-Marathon 2027 - Trainingsplan</h1>
<div class="sub">Ziel 3:40h - 43 Wochen - bearbeiten, Drag&amp;Drop, Balance-Pruefung, HM-Kennzahl, lokal gespeichert.</div>
<div id="status">Lade...</div>
<div class="bar"><select id="weekSel"></select>
<button id="suggest">Woche ausbalancieren</button>
<button id="reset">Woche zuruecksetzen</button>
<button id="resetAll">Alles zuruecksetzen</button></div>
<div class="phase" id="phase"></div>
<div class="stats">
<div class="stat"><b id="kmDone">0</b><span>km erledigt</span></div>
<div class="stat"><b id="kmPlan">0</b><span>km geplant</span></div>
<div class="stat"><b id="prog">0%</b><span>Fortschritt</span></div>
<div class="stat"><b id="kmBlock">0</b><span>km Block</span></div>
<div class="stat"><b id="hmW">0</b><span>HM Woche</span></div>
<div class="stat"><b id="load">0</b><span>Last</span></div></div>
<div id="chart"></div>
<div class="balance" id="balance"></div>
<div class="legend" id="legend"></div>
<table><thead><tr><th></th><th>OK</th><th>Tag</th><th>Einheit</th><th>km</th><th>Typ</th><th>Last</th></tr></thead><tbody id="body"></tbody></table>
<script>
var S=document.getElementById("status");
try{
var COL={easy:"#3b82f6",long:"#ef4444",interval:"#a855f7",threshold:"#f59e0b",tempo:"#ec4899",fartlek:"#14b8a6",strength:"#64748b",rest:"#334155",race:"#eab308"};
var LAB={easy:"Easy",long:"Long Run",interval:"Intervall",threshold:"Schwelle",tempo:"Tempo",fartlek:"Fartlek",strength:"Kraft",rest:"Ruhe",race:"Wettkampf"};
var INT={rest:0,strength:2,easy:1,long:4,interval:4,threshold:3,tempo:3,fartlek:3,race:5};
var WD=["Mo","Di","Mi","Do","Fr","Sa","So"],KEY="stefan-jf-v6";
function cls(t){t=(t||"").toUpperCase();if(!t.replace(/\s/g,""))return"rest";
if(t.indexOf("RENN-SIM")>-1)return"long";if(t.indexOf("RACE")>-1)return"race";
if(t.indexOf("OFF")===0||t.indexOf("AUSROLLEN")===0)return"rest";
if(t.indexOf("K-")===0||t.indexOf("KRAFT")>-1)return"strength";
if(t.indexOf("IVT")>-1)return"interval";if(t.indexOf("TEMPO")>-1)return"tempo";
if(t.indexOf("FARTLEK")>-1)return"fartlek";if(t.indexOf("DL2")>-1)return"threshold";
if(t.indexOf("LSR")>-1)return"long";return"easy";}
function km(t){var m=(t||"").match(/(\d+[.,]?\d*)\s*km/i);return m?parseFloat(m[1].replace(",",".")):0;}
function hm(t){var m=(t||"").match(/HM\s*(\d{2,4})/i);return m?parseInt(m[1],10):0;}
var DATA=
"1|Grundlage 1|16.11.26||K-Max~ESR 10km~ESR 8km~ESR 9km~Off~DL2 2x2k~LSR 16km HM150\n"+
"2|Grundlage 1|23.11.26||K-Max~ESR 11km~ESR 9km~ESR 10km~Off~DL2 3x2k~LSR 18km HM200\n"+
"3|Grundlage 1|30.11.26||K-Max~Fartlek 10km~ESR 10km~ESR 11km~Off~DL2 2x2k+1x1k~LSR 20km HM250\n"+
"4|Grundlage 1|07.12.26||K-Max~ESR 12km~ESR 10km~ESR 13km~Off~DL2 3x2k~LSR 22km HM300\n"+
"5|Grundlage 1|14.12.26||K-Max~Fartlek 12km~ESR 11km~ESR 12km~Off~DL2 2x3k~LSR 24km HM350\n"+
"6|Grundlage 1|21.12.26|Weihnachtswoche Vereinslauf|K-Max~ESR 12km~ESR 8km~ESR 10km~Off~DL2 2x2k~LSR 30km Bern-Thun HM100\n"+
"7|Grundlage 2|28.12.26||K-Max~IVT 6x600m~ESR 10km~ESR 13km~Off~DL2 3x2k~LSR 26km HM300\n"+
"8|Grundlage 2|04.01.27||K-Max~IVT 8x600m~ESR 11km~ESR 13km~Off~DL2 2x2k+1x3k~LSR 28km HM350\n"+
"9|Grundlage 2|11.01.27||K-Max~DL2 3x1km~ESR 11km~ESR 14km~Off~DL2 2x3k~LSR 28km HM600\n"+
"10|Grundlage 2|18.01.27|DELOAD 3:1|K-Max~IVT 8x800m~ESR 12km~ESR 14km~Off~DL2 2x2k locker~LSR 22km HM250\n"+
"11|Grundlage 2|25.01.27||K-Max~DL2 2x1k+2x2k~ESR 12km~ESR 15km~Off~DL2 2x3k Berg HM250~LSR 30km HM800\n"+
"12|Grundlage 2|01.02.27|Feldtest Schwelle|K-Max~IVT 10x800m~ESR 13km~ESR 15km~Off~DL2 3x2k Berg HM300~LSR 32km HM1000\n"+
"13|Aufbau 1|08.02.27||K-KA~DL2 3x2k~ESR 10km~Fartlek 14km~Off~DL2 2x3k Berg HM350~LSR 30km HM1000\n"+
"14|Aufbau 1|15.02.27||K-KA~DL2 2x2k+1x3k~ESR 10km~IVT 6x1000m~Off~DL2 2x2k Berg HM300~LSR 28km HM400\n"+
"15|Aufbau 1|22.02.27||K-KA~DL2 4x2k~ESR 10km~Fartlek 12km~Off~DL2 2x3k Berg HM350~LSR 24km HM350\n"+
"16|Aufbau 1|01.03.27|Formaufbau|K-KA~Tempo 8km~ESR 9km~IVT 8x1000m~Off~DL2 3x1k~LSR 20km HM250\n"+
"17|Aufbau 1|08.03.27|Taper|Off~Tempo 6km~ESR 6km~Fartlek 8km~Off~DL2 2x1k~LSR 14km HM80\n"+
"18|Aufbau 1|15.03.27|Kerzerslauf 20.03.|Off~ESR 6km~Ausschuetteln 5km~Off~Off~RACE Kerzerslauf 15km~Einlaufen 4km\n"+
"19|Regeneration|22.03.27|Regeneration|K-Max~ESR 9km~ESR 8km~ESR 8km~Off~DL2 2x2k~LSR 16km HM80\n"+
"20|Aufbau 2|29.03.27||K-KA~IVT 6x400m~ESR 10km~ESR 10km~Off~DL2 3x2k~LSR 20km HM250\n"+
"21|Aufbau 2|05.04.27||K-KA~IVT 8x400m~ESR 11km~ESR 10km~Off~DL2 2x2k+1x3k~LSR 22km HM300\n"+
"22|Aufbau 2|12.04.27||K-KA~Tempo 6km~ESR 11km~ESR 11km~Off~DL2 3x2k~LSR 24km HM350\n"+
"23|Aufbau 2|19.04.27||K-KA~IVT 10x400m~ESR 12km~ESR 11km~Off~DL2 2x3k~LSR 26km HM400\n"+
"24|Aufbau 2|26.04.27|Richtung GP Bern|K-KA~Tempo 8km~ESR 10km~ESR 9km~Off~DL2 3x2k~LSR 20km HM250\n"+
"25|Aufbau 2|03.05.27|Taper|Off~Tempo 5km~ESR 6km~Fartlek 8km~Off~DL2 2x1k~LSR 14km HM80\n"+
"26|Aufbau 2|10.05.27|GP Bern 15.05.|Off~ESR 6km~Ausschuetteln 5km~Off~Off~RACE GP Bern 16km~Einlaufen 4km\n"+
"27|Berg-Aufbau|17.05.27|Bergaufbau|K-KA~Fartlek 12km~ESR 10km~ESR 10km~Off~DL2 2x3k Berg HM350~LSR 22km HM800\n"+
"28|Berg-Aufbau|24.05.27||K-KA~DL2 3x2k~ESR 10km~ESR 11km~Off~DL2 2x3k Berg HM400~LSR 26km HM1000\n"+
"29|Berg-Aufbau|31.05.27|Feldtest Berg|K-KA~Fartlek 14km~ESR 11km~ESR 12km~Off~DL2 3x2k Berg HM450~LSR 30km HM1200\n"+
"30|Berg-Aufbau|07.06.27|LGT Alpin 12.06.|Off~ESR 10km~Ausschuetteln 6km~Off~Off~RACE LGT Alpin Staffel~Einlaufen 5km\n"+
"31|Regeneration|14.06.27|Regeneration|K-Max~ESR 9km~ESR 8km~ESR 8km~Off~DL2 2x2k~LSR 16km HM80\n"+
"32|Aufbau 2|21.06.27||K-KA~IVT 6x600m~ESR 11km~ESR 10km~Off~DL2 2x3k Berg HM300~LSR 22km HM400\n"+
"33|Aufbau 2|28.06.27|Taper Zermatt|Off~Tempo 6km~ESR 6km~Fartlek 8km~Off~DL2 2x1k~LSR 14km HM80\n"+
"34|Aufbau 2|05.07.27|Zermatt 03.07.|Off~ESR 6km~Ausschuetteln 5km~Off~Off~RACE Zermatt 21km HM900~Einlaufen 4km\n"+
"35|Marathon-spez.|12.07.27|Regeneration|K-Erh~ESR 11km~ESR 10km~ESR 9km~Off~DL2 3x2k~LSR 20km HM400\n"+
"36|Marathon-spez.|19.07.27|Race-Sim Flach-Berg Fueling|K-Erh~DL2 2x2k+2x3k~ESR 12km~Fartlek 14km~Off~DL2 3x3k Berg HM500~LSR Renn-Sim 34km HM1000\n"+
"37|Marathon-spez.|26.07.27|Race-Sim 2|K-Erh~DL2 3x2k+1x3k~ESR 12km~IVT 6x1000m~Off~DL2 3x3k Berg HM550~LSR Renn-Sim 36km HM1200\n"+
"38|Marathon-spez.|02.08.27|DELOAD vor Peak|K-Erh~DL2 3x2k~ESR 13km~ESR 10km~Off~DL2 2x2k Berg HM300~LSR 26km HM500\n"+
"39|Marathon-spez.|09.08.27|PEAK groesste Race-Sim|K-Erh~DL2 3x2k+2x3k~ESR 12km~IVT 8x1000m~Off~DL2 3x3k Berg HM500~LSR Renn-Sim 38km HM1500\n"+
"40|Marathon-spez.|16.08.27|Generalprobe|K-Erh~DL2 4x2k~ESR 11km~Fartlek 14km~Off~DL2 2x3k Berg HM400~LSR 30km HM1000\n"+
"41|Taper|23.08.27|Taper -40%|K-Erh~DL2 2x2k~ESR 9km~Fartlek 8km~Off~DL2 2x2k Berg HM200~LSR 18km HM500\n"+
"42|Taper|30.08.27||Off~ESR 8km~ESR 6km~Fartlek 6km~Off~ESR 10km +Renntempo~Off\n"+
"43|Race|06.09.27|JUNGFRAU-MARATHON 11.09.|Off~ESR 6km~ESR 5km~Off~Off~RACE DAY 42.2km HM1829~Ausrollen";
function build(){return DATA.split("\n").map(function(line){
var p=line.split("|");var days=p[4].split("~").map(function(t,i){
return{day:WD[i],text:t,km:km(t),hm:hm(t),typ:cls(t),done:false};});
return{woche:+p[0],phase:p[1],datum:p[2],bemerkung:p[3],days:days};});}
var weeks=[],cur=0;
function load(){try{var s=localStorage.getItem(KEY);weeks=s?JSON.parse(s):build();}catch(e){weeks=build();}
if(!Array.isArray(weeks)||!weeks.length)weeks=build();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(weeks));}catch(e){}}
function sel(){var s=document.getElementById("weekSel");s.innerHTML="";
weeks.forEach(function(w,i){var o=document.createElement("option");o.value=i;o.textContent="Woche "+w.woche+" - "+w.phase;s.appendChild(o);});s.value=cur;}
document.getElementById("weekSel").addEventListener("change",function(e){cur=+e.target.value;render();});
function leg(){var l=document.getElementById("legend");l.innerHTML="";
Object.keys(LAB).forEach(function(k){l.innerHTML+='<span><i class="dot" style="background:'+COL[k]+'"></i>'+LAB[k]+'</span>';});}
function render(){var w=weeks[cur];if(!w)return;document.getElementById("weekSel").value=cur;
document.getElementById("phase").textContent="Phase: "+w.phase+" - Start "+w.datum+(w.bemerkung?" - "+w.bemerkung:"");
var b=document.getElementById("body");b.innerHTML="";
w.days.forEach(function(d,i){var tr=document.createElement("tr");
tr.className="row"+(d.done?" done":"");tr.draggable=true;
tr.innerHTML='<td class="handle">&#9776;</td><td><input type="checkbox" '+(d.done?"checked":"")+' data-a="done"></td>'+
'<td class="wd">'+WD[i]+'</td><td><textarea data-a="text">'+d.text.replace(/</g,"&lt;")+'</textarea></td>'+
'<td><input class="km" type="number" step="0.1" value="'+d.km+'" data-a="km"></td>'+
'<td><select data-a="typ">'+Object.keys(LAB).map(function(k){return '<option value="'+k+'" '+(k===d.typ?"selected":"")+'>'+LAB[k]+'</option>';}).join("")+'</select></td>'+
'<td><span class="pill" style="background:'+COL[d.typ]+'">'+INT[d.typ]+'</span></td>';
tr.querySelector('[data-a=done]').onchange=function(e){d.done=e.target.checked;save();render();};
tr.querySelector('[data-a=text]').onchange=function(e){d.text=e.target.value;d.km=km(d.text);d.hm=hm(d.text);d.typ=cls(d.text);save();render();};
tr.querySelector('[data-a=km]').onchange=function(e){d.km=parseFloat(e.target.value)||0;save();stats();chart();};
tr.querySelector('[data-a=typ]').onchange=function(e){d.typ=e.target.value;save();render();};
tr.addEventListener("dragstart",function(e){e.dataTransfer.setData("t",i);});
tr.addEventListener("dragover",function(e){e.preventDefault();tr.classList.add("dragover");});
tr.addEventListener("dragleave",function(){tr.classList.remove("dragover");});
tr.addEventListener("drop",function(e){e.preventDefault();tr.classList.remove("dragover");var f=+e.dataTransfer.getData("t");if(f===i)return;
var m=w.days.splice(f,1)[0];w.days.splice(i,0,m);w.days.forEach(function(x,k){x.day=WD[k];});save();render();});
b.appendChild(tr);});
stats();chart();balance();}
function stats(){var w=weeks[cur];
var pl=w.days.reduce(function(s,d){return s+d.km;},0);
var dn=w.days.filter(function(d){return d.done;}).reduce(function(s,d){return s+d.km;},0);
var bl=weeks.reduce(function(s,x){return s+x.days.reduce(function(a,d){return a+d.km;},0);},0);
var h=w.days.reduce(function(s,d){return s+d.hm;},0);
var ld=w.days.reduce(function(s,d){return s+INT[d.typ];},0);
document.getElementById("kmPlan").textContent=Math.round(pl);
document.getElementById("kmDone").textContent=Math.round(dn);
document.getElementById("prog").textContent=(pl?Math.round(dn/pl*100):0)+"%";
document.getElementById("kmBlock").textContent=Math.round(bl);
document.getElementById("hmW").textContent=h;
document.getElementById("load").textContent=ld;}
function chart(){var w=weeks[cur];var mx=1;w.days.forEach(function(d){if(d.km>mx)mx=d.km;});
var bw=44,gap=14,h=140,W=w.days.length*(bw+gap)+20,s="";
w.days.forEach(function(d,i){var bh=d.km/mx*(h-30),x=10+i*(bw+gap),y=h-bh-18;
s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+COL[d.typ]+'"></rect>'+
'<text x="'+(x+bw/2)+'" y="'+(y-4)+'" fill="#e7eef5" font-size="11" text-anchor="middle">'+(d.km||"")+'</text>'+
'<text x="'+(x+bw/2)+'" y="'+(h-4)+'" fill="#93a4b3" font-size="11" text-anchor="middle">'+WD[i]+'</text>';});
document.getElementById("chart").innerHTML='<svg width="100%" viewBox="0 0 '+W+' '+h+'">'+s+'</svg>';}
function balance(){var w=weeks[cur],bx=document.getElementById("balance");
var hard=w.days.map(function(d){return INT[d.typ]>=3;});
var rows=document.querySelectorAll("#body tr");rows.forEach(function(t){t.classList.remove("warn");});
var c=[];for(var i=0;i<hard.length-1;i++){if(hard[i]&&hard[i+1]){c.push(i);
if(rows[i])rows[i].classList.add("warn");if(rows[i+1])rows[i+1].classList.add("warn");}}
if(c.length){bx.className="balance bad";bx.innerHTML="Nicht ausbalanciert: "+c.length+"x zwei harte Tage direkt hintereinander ("+c.map(function(i){return WD[i]+"-"+WD[i+1];}).join(", ")+"). Klicke Woche ausbalancieren.";}
else{bx.className="balance ok";bx.innerHTML="Ausgewogen: keine zwei harten Tage direkt hintereinander - Reize und Erholung im Gleichgewicht.";}}
document.getElementById("suggest").onclick=function(){var w=weeks[cur];
var hd=w.days.filter(function(d){return INT[d.typ]>=3;});
var ea=w.days.filter(function(d){return INT[d.typ]<3;});
var r=[],hi=0,ei=0;while(hi<hd.length||ei<ea.length){if(hi<hd.length)r.push(hd[hi++]);if(ei<ea.length)r.push(ea[ei++]);}
for(var i=0;i<r.length-1;i++){if(INT[r[i].typ]>=3&&INT[r[i+1].typ]>=3){
var j=-1;for(var k=i+2;k<r.length;k++){if(INT[r[k].typ]<3){j=k;break;}}
if(j>-1){var e=r.splice(j,1)[0];r.splice(i+1,0,e);}}}
r.forEach(function(d,k){d.day=WD[k];});w.days=r;save();render();};
document.getElementById("reset").onclick=function(){weeks[cur]=build()[cur];save();render();};
document.getElementById("resetAll").onclick=function(){if(confirm("Alle Aenderungen verwerfen?")){try{localStorage.removeItem(KEY);}catch(e){}load();sel();render();}};
load();sel();leg();render();
S.textContent=weeks.length+" Wochen geladen. Alles bereit.";
}catch(err){S.className="bad";S.textContent="Fehler: "+err.message;}
</script></body></html>
